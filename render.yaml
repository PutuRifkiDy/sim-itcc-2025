services:
  - type: web
    name: sim-itcc-2025
    runtime: docker
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: SIM ITCC 2025
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: sim-itcc-2025
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: sim-itcc-2025-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sim-itcc-2025-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sim-itcc-2025-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sim-itcc-2025-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sim-itcc-2025-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: FILESYSTEM_DISK
        value: local

databases:
  - name: sim-itcc-2025-db
    plan: free
    databaseName: sim_itcc_2025
    user: sim_itcc_user
